<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FFmpeg WASM Video Contact Sheet demo</title>
  <style>body{font-family:system-ui,sans-serif;max-width:860px;margin:32px auto;padding:0 16px;line-height:1.6}button,input,select{font:inherit}button{padding:10px 16px}pre{min-height:120px;padding:12px;background:#f4f4f4;white-space:pre-wrap;overflow:auto}.ok{padding:10px 12px;background:#eef8f1;border-radius:8px}progress,canvas{width:100%}canvas{display:block;background:#111;margin-top:16px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}</style>
</head>
<body>
  <h1>Video Contact Sheet</h1>
  <p class="ok">FFmpeg WASMで動画全体から均等にフレームを取得します。SharedArrayBuffer / COOP / COEP は不要です。</p>
  <div class="row">
    <input id="file" type="file" accept="video/*">
    <select id="count"><option value="12">12枚</option><option value="24">24枚</option><option value="48">48枚</option></select>
    <button id="run">コンタクトシートを作る</button>
    <button id="save" hidden>PNG保存</button>
  </div>
  <progress id="progress" value="0" max="1"></progress>
  <canvas id="canvas" hidden></canvas>
  <pre id="log"></pre>
  <script id="ffmpeg-js-gzip" type="application/octet-stream">__FFMPEG_JS_GZIP_BASE64__</script>
  <script id="ffmpeg-wasm-gzip" type="application/octet-stream">__FFMPEG_WASM_GZIP_BASE64__</script>
  <script>__FFMPEG_RUNTIME__</script>
  <script>
    const $ = (id) => document.getElementById(id); let runnerPromise;
    function base64Blob(text){const clean=text.replace(/\s+/g,"");const chunks=[];for(let o=0;o<clean.length;o+=32768){const b=atob(clean.slice(o,o+32768));const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);chunks.push(a)}return new Blob(chunks,{type:"application/gzip"})}
    async function gunzip(id,text){if(!("DecompressionStream" in window))throw new Error("DecompressionStream 非対応ブラウザーです。");const r=new Response(base64Blob($(id).textContent).stream().pipeThrough(new DecompressionStream("gzip")));return text?await r.text():await r.arrayBuffer()}
    async function prepare(){if(!runnerPromise)runnerPromise=(async()=>BrowserFFmpeg.loadEmbedded({coreJsText:await gunzip("ffmpeg-js-gzip",true),wasmBytes:await gunzip("ffmpeg-wasm-gzip",false)}))();return runnerPromise}
    function drawPpm(ppm){const canvas=$("canvas"),ctx=canvas.getContext("2d");canvas.width=ppm.width;canvas.height=ppm.height;const image=ctx.createImageData(ppm.width,ppm.height),rgba=image.data,p=ppm.pixels;for(let s=0,d=0;s<p.length;s+=3,d+=4){rgba[d]=p[s];rgba[d+1]=p[s+1];rgba[d+2]=p[s+2];rgba[d+3]=255}ctx.putImageData(image,0,0);canvas.hidden=false}
    $("run").onclick=async()=>{const f=$("file").files[0];if(!f)return alert("動画を選んでください。");$("run").disabled=true;$("save").hidden=true;$("log").textContent="";$("progress").value=0;try{const runner=await prepare(),ppmPath="/contact-sheet.ppm",jsonPath="/contact-sheet.json";const result=await runner.run({files:[{name:"/workerfs/input.bin",data:f,workerfs:true}],outputs:[ppmPath,jsonPath],args:BrowserFFmpeg.videoContactSheetArgs({input:"/workerfs/input.bin",output:ppmPath,metadataOutput:jsonPath,count:Number($("count").value),thumbSize:320}),onLog:({message})=>$("log").textContent+=message+"\n",onProgress:v=>$("progress").value=v});const ppm=BrowserFFmpeg.decodePpmOutput(result,ppmPath),meta=BrowserFFmpeg.decodeJsonOutput(result,jsonPath);drawPpm(ppm);$("log").textContent+=`\n${meta.count} samples / ${meta.sheetWidth}x${meta.sheetHeight} / ${meta.codec}\n`;$("save").hidden=false}catch(e){$("log").textContent+="ERROR: "+e.message+"\n"}finally{$("run").disabled=false}};
    $("save").onclick=()=>{$("canvas").toBlob(blob=>{if(!blob)return;const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="video-contact-sheet.png";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},"image/png")};
  </script>
</body></html>

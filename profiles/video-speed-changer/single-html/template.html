<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Video Speed Changer WASM demo</title><style>body{font-family:system-ui,sans-serif;max-width:720px;margin:32px auto;padding:0 16px;line-height:1.6}button,input,select{font:inherit}button{padding:10px 16px}pre{min-height:120px;padding:12px;background:#f4f4f4;white-space:pre-wrap;overflow:auto}progress{width:100%}</style></head><body><h1>Video Speed Changer WASM</h1><input id="file" type="file" accept="video/*"><select id="rate"><option>0.25</option><option>0.5</option><option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>2</option><option>3</option><option>4</option></select>× <label><input id="preserve" type="checkbox" checked>音程維持</label> <label><input id="mute" type="checkbox">音声なし</label> <button id="run">変換</button> <a id="download" hidden>結果を保存</a><progress id="progress" value="0" max="1"></progress><pre id="log"></pre><script id="ffmpeg-js-gzip" type="application/octet-stream">__FFMPEG_JS_GZIP_BASE64__</script><script id="ffmpeg-wasm-gzip" type="application/octet-stream">__FFMPEG_WASM_GZIP_BASE64__</script><script>__FFMPEG_RUNTIME__</script><script>const $=id=>document.getElementById(id);let runnerPromise;function base64Blob(text){const clean=text.replace(/\s+/g,"");const chunks=[];for(let o=0;o<clean.length;o+=32768){const b=atob(clean.slice(o,o+32768));const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);chunks.push(a)}return new Blob(chunks,{type:"application/gzip"})}async function gunzip(id,text){const r=new Response(base64Blob($(id).textContent).stream().pipeThrough(new DecompressionStream("gzip")));return text?await r.text():await r.arrayBuffer()}async function prepare(){if(!runnerPromise)runnerPromise=(async()=>BrowserFFmpeg.loadEmbedded({coreJsText:await gunzip("ffmpeg-js-gzip",true),wasmBytes:await gunzip("ffmpeg-wasm-gzip",false)}))();return runnerPromise}$('run').onclick=async()=>{const f=$('file').files[0];if(!f)return alert('動画を選んでください。');$('run').disabled=true;$('download').hidden=true;try{const runner=await prepare();const result=await runner.run({files:[{name:'/workerfs/input.mp4',data:f,workerfs:true}],outputs:['/output.mp4'],args:BrowserFFmpeg.videoSpeedChangerArgs({input:'/workerfs/input.mp4',output:'/output.mp4',rate:Number($('rate').value),preservePitch:$('preserve').checked,noAudio:$('mute').checked}),onProgress:v=>$('progress').value=v,onLog:({message})=>$('log').textContent+=message+'\n'});const url=URL.createObjectURL(new Blob([result.files[0].data],{type:'video/mp4'}));$('download').href=url;$('download').download='speed.mp4';$('download').hidden=false}catch(e){$('log').textContent+='ERROR: '+e.message+'\n'}finally{$('run').disabled=false}};</script></body></html>

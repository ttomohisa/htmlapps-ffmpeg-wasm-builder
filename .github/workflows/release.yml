name: Release FFmpeg WASM

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2.2.0

      - name: Source checks
        shell: pwsh
        run: ./scripts/check-repository.ps1

      - name: Verify tag matches builder version
        shell: bash
        run: |
          set -euo pipefail
          source ./versions.env
          test "${GITHUB_REF_NAME}" = "v${BUILDER_VERSION}"

      - name: Build and smoke-test release profiles
        shell: bash
        env:
          FFMPEG_WASM_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          chmod +x ./build.sh ./scripts/*.sh
          ./build.sh video-compressor
          ./build.sh lossless-video-cutter
          ./build.sh media-inspector

      - name: Prepare binary and corresponding-source bundles
        shell: bash
        run: ./scripts/prepare-release.sh "${GITHUB_REF_NAME}"

      - name: Show release checksums
        shell: bash
        run: cat release/SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source ./versions.env
          gh release create "${GITHUB_REF_NAME}" \
            release/ffmpeg-wasm-video-compressor-v${BUILDER_VERSION}.zip \
            release/ffmpeg-wasm-lossless-video-cutter-v${BUILDER_VERSION}.zip \
            release/ffmpeg-wasm-media-inspector-v${BUILDER_VERSION}.zip \
            release/ffmpeg-wasm-sources-v${BUILDER_VERSION}.tar.gz \
            release/BUILDINFO-video-compressor.txt \
            release/BUILDINFO-lossless-video-cutter.txt \
            release/BUILDINFO-media-inspector.txt \
            release/SHA256SUMS.txt \
            --verify-tag \
            --title "FFmpeg WASM Builder ${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes "Profile-specific FFmpeg WebAssembly cores are attached with exact build information, checksums, license notices, and one matching corresponding-source archive."

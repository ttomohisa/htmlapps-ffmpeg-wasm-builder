name: Check FFmpeg toolchain updates

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check latest versions
        shell: pwsh
        run: ./scripts/check-updates.ps1
